name: Rolex Live - PWA e GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'icons/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Installa Pillow
        run: python3 -m pip install --user pillow
      - name: Crea le icone dall'immagine del Rolex
        run: python3 scripts/create_icons.py
      - name: Salva le icone nella repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/
          if ! git diff --cached --quiet; then
            git commit -m "Genera icone PWA Rolex"
            git push
          fi
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Carica sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
