<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090a0f;color:#eef0f4}
body{min-height:100svh;min-height:100dvh;display:flex;align-items:center;flex-direction:column;justify-content:space-between;overflow-x:hidden}
header{padding:18px 12px 5px;text-align:center;flex-shrink:0}header h1{font-size:13px;font-weight:650;letter-spacing:.22em;margin:0;color:#f0f0f4}
header .subtitle{margin-top:6px;color:#9b9da7;font-size:11px;letter-spacing:.07em}
main{display:flex;justify-content:center;align-items:center;flex:1;min-height:0;width:100%;overflow:hidden}
.watch{position:relative;width:min(94vw,47dvh,545px);aspect-ratio:545 / 825;isolation:isolate;user-select:none;-webkit-user-select:none;flex-shrink:0}
.watch img,.watch svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.watch img{object-fit:fill}.watch svg{overflow:visible}
footer{text-align:center;width:100%;padding:5px 12px max(14px,env(safe-area-inset-bottom));flex-shrink:0}
.digital{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';font-size:clamp(18px,4vw,25px);letter-spacing:.09em;font-weight:500}
.date-text{font-size:12px;color:#9c9fa9;margin:4px 0 10px}
.status{display:flex;justify-content:center;align-items:center;gap:6px;color:#b8bbc5;font-size:11px;min-height:18px}
.dot{width:7px;height:7px;border-radius:50%;background:#c28b3f;display:inline-block}.dot.ok{background:#68bd85}
.actions{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
[hidden]{display:none!important}
button,select{background:#1b1d26;border:1px solid #363947;color:#eceef2;border-radius:20px;font:inherit;font-size:12px;padding:8px 13px;cursor:pointer}
button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:wait}
select{max-width:185px}
@media(max-height:680px){header{padding-top:8px}header .subtitle{display:none}.date-text{margin-bottom:3px}.actions{margin-top:5px}footer{padding-bottom:8px}.watch{width:min(89vw,45dvh,545px)}}

.jb-toggle[aria-pressed="true"]{background:#624820;border-color:#c4a366;color:#ffe0a0}
.jb-toggle:focus-visible{outline:2px solid #f9d59b;outline-offset:3px}
.watch.jb{aspect-ratio:2 / 3}
.watch.jb img{object-fit:fill}
@media(max-height:680px){.title-line{gap:8px}.jb-toggle{min-height:29px}}
</style></head><body>

<script>
'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
let baseEpoch = Date.now(), basePerf = performance.now(), synced = false;
const angleAt = (hour) => hour * 30;
function currentEpoch(){return baseEpoch + (performance.now() - basePerf);}
function zone(){return $('zone').value==='local' ? (Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Rome') : $('zone').value;}
function svgNode(name,attrs,parent){const el=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));parent.appendChild(el);return el;}
for(let i=0;i<60;i++){
 const angle=i*6, major=i%5===0;
 svgNode('line',{x1:618,y1:470-(major?141:142),x2:618,y2:470-(major?146:145),stroke:major?'#b9bdc6':'#818591','stroke-width':major?1.4:.75,opacity:major?.94:.8,transform:`rotate(${angle} 618 470)`},$('ticks'));
}
for(let h=1;h<=11;h++){
 if(h===3||h===6||h===9)continue;
 const r=115,a=h*Math.PI/6,x=618+Math.sin(a)*r,y=470-Math.cos(a)*r;
 svgNode('circle',{cx:x,cy:y,r:10.8,fill:'url(#steel)',stroke:'#393c45','stroke-width':1.2},$('markers'));
 svgNode('circle',{cx:x,cy:y,r:7.9,fill:'url(#lume)',stroke:'#828893','stroke-width':.7},$('markers'));
}
svgNode('path',{d:'M618 343 L600 378 L636 378 Z',fill:'url(#steel)',stroke:'#4a4b57','stroke-width':1.3},$('markers'));
svgNode('path',{d:'M618 349 L606 375 L630 375 Z',fill:'url(#lume)'},$('markers'));
for(const [x,y,w,h] of [[488,464,35,12],[611,574,14,35]]){
 svgNode('rect',{x,y,width:w,height:h,rx:2,fill:'url(#steel)',stroke:'#3e4651','stroke-width':1.1},$('markers'));
 svgNode('rect',{x:x+2.7,y:y+2.3,width:w-5.4,height:h-4.6,rx:1,fill:'url(#lume)'},$('markers'));
}


// Indici e minuti del quadrante vintage senza datario.
for(let i=0;i<60;i++){
 const a=i*6, major=(i%5===0);
 svgNode('line',{x1:502,y1:703-(major?252:257),x2:502,y2:703-(major?263:263),stroke:'#d39c31','stroke-width':major?3.3:1.8,opacity:major?.95:.84,transform:`rotate(${a} 502 703)`},$('jbTicks'));
}
for(let h=1;h<=11;h++){
 const a=h*Math.PI/6, radius=212, x=502+Math.sin(a)*radius, y=703-Math.cos(a)*radius;
 if(h===3||h===6||h===9){
  const w=h===6?24:62,he=h===6?71:25;
  svgNode('rect',{x:x-w/2,y:y-he/2,width:w,height:he,rx:3,fill:'url(#jbGold)',stroke:'#4d3b23','stroke-width':2},$('jbMarkers'));
  svgNode('rect',{x:x-w/2+4,y:y-he/2+4,width:w-8,height:he-8,rx:2,fill:'url(#jbLume)'},$('jbMarkers'));
 }else{
  svgNode('circle',{cx:x,cy:y,r:21,fill:'url(#jbGold)',stroke:'#4e361b','stroke-width':2},$('jbMarkers'));
  svgNode('circle',{cx:x,cy:y,r:16.5,fill:'url(#jbLume)',stroke:'#a17a34','stroke-width':1.3},$('jbMarkers'));
 }
}
svgNode('path',{d:'M502 469 L473 538 L531 538 Z',fill:'url(#jbGold)',stroke:'#4f391b','stroke-width':2.5},$('jbMarkers'));
svgNode('path',{d:'M502 476 L481 533 L523 533 Z',fill:'url(#jbLume)'},$('jbMarkers'));

function changeFace(jb){
 $('watchClassic').hidden=jb;
 $('watchJB').hidden=!jb;
 $('jbToggle').setAttribute('aria-pressed',String(jb));
 $('jbToggle').title=jb?'Torna al Rolex classico':'Mostra il Rolex James Bond';
 $('subtitle').textContent=jb?'James Bond • Cinturino NATO • Senza datario':'Quadrante animato • Data automatica';
 try{localStorage.setItem('rolex-live-jb-layout',jb?'1':'0');}catch(e){}
}
$('jbToggle').addEventListener('click',()=>changeFace($('jbToggle').getAttribute('aria-pressed')!=='true'));
try {if(localStorage.getItem('rolex-live-jb-layout')==='1')changeFace(true);}catch(e){}

function frame(){
 const epoch=currentEpoch(), date=new Date(epoch), tz=zone();
 const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',hourCycle:'h23'}).formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
 const ms=((epoch%1000)+1000)%1000;
 const hours=(parts.hour%12)+parts.minute/60+(parts.second+ms/1000)/3600;
 const mins=parts.minute+(parts.second+ms/1000)/60;
 const secs=parts.second+ms/1000;
 $('hourHand').setAttribute('transform',`rotate(${hours*30} 618 470)`);
 $('minuteHand').setAttribute('transform',`rotate(${mins*6} 618 470)`);
 $('secondHand').setAttribute('transform',`rotate(${secs*6} 618 470)`);
 $('jbHourHand').setAttribute('transform',`rotate(${hours*30} 502 703)`);
 $('jbMinuteHand').setAttribute('transform',`rotate(${mins*6} 502 703)`);
 $('jbSecondHand').setAttribute('transform',`rotate(${secs*6} 502 703)`);
 $('dayNumber').textContent=parts.day;
 $('digital').textContent=`${String(parts.hour).padStart(2,'0')}:${String(parts.minute).padStart(2,'0')}:${String(parts.second).padStart(2,'0')}`;
 if(!window.lastDayText || window.lastDayText!==`${parts.day}-${parts.hour}-${tz}`){
  $('fullDate').textContent=new Intl.DateTimeFormat('it-IT',{timeZone:tz,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(date);
  window.lastDayText=`${parts.day}-${parts.hour}-${tz}`;
 }

}
function status(message,ok){$('status').textContent=message;$('dot').classList.toggle('ok',ok);}
async function fetchWithTimeout(url){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),6500);try{
 const start=performance.now();const res=await fetch(url,{signal:controller.signal,cache:'no-store'});const end=performance.now();
 if(!res.ok)throw Error(`HTTP ${res.status}`);
 return {data:await res.json(), midpoint:(start+end)/2};
}finally{clearTimeout(timeout);}}
async function synchronize(){
 const btn=$('syncBtn');btn.disabled=true;status('Sincronizzazione con Internet…',false);
 const providers=[
  {url:'https://timeapi.io/api/Time/current/zone?timeZone=UTC',parse:d=>Date.UTC(d.year,d.month-1,d.day,d.hour,d.minute,d.seconds||0,d.milliSeconds||0)},
  {url:'https://worldtime.timezone.io/api/timezone/Etc/UTC',parse:d=>Date.parse(d.utc_datetime||d.datetime)}
 ];
 let err=null;
 for(const p of providers){try{
  const {data,midpoint}=await fetchWithTimeout(p.url);
  const epoch=p.parse(data);if(!Number.isFinite(epoch))throw Error('Data non valida');
  baseEpoch=epoch;basePerf=midpoint;synced=true;
  status('Sincronizzato con ora Internet',true);btn.disabled=false;return;
 }catch(e){err=e;}}
 // For offline use, fall back to device system clock.
 if(!synced){baseEpoch=Date.now();basePerf=performance.now();}
 status(synced?'Rete assente · mantiene ultima sincronizzazione':'Rete non disponibile · ora del dispositivo',false);btn.disabled=false;
}
$('syncBtn').addEventListener('click',synchronize);
$('zone').addEventListener('change',()=>{window.lastDayText='';status(synced?'Sincronizzato con ora Internet':'Ora del dispositivo',synced);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden && navigator.onLine) synchronize();});
window.addEventListener('online',synchronize);
frame();setInterval(frame,50);synchronize();
setInterval(()=>{if(navigator.onLine)synchronize();},30*60*1000);

// PWA: unique manifest identity, independently installable from other projects.
let pendingInstall = null;
const installBtn=$('installBtn');
window.addEventListener('beforeinstallprompt', event => {
 event.preventDefault();
 pendingInstall=event;
 installBtn.hidden=false;
});
installBtn.addEventListener('click', async () => {
 if(!pendingInstall) return;
 const event=pendingInstall;
 pendingInstall=null;
 installBtn.hidden=true;
