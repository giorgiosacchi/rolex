<title>Rolex Live — Orologio sincronizzato</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:0;background:#090a0f;color:#eef0f4;overflow:hidden;overscroll-behavior:none}
body{height:100svh;height:100dvh;min-height:0;display:flex;align-items:center;flex-direction:column;justify-content:center;overflow:hidden;overscroll-behavior:none}
header{padding:14px 12px 5px;text-align:center;flex-shrink:0}header h1{font-size:13px;font-weight:650;letter-spacing:.22em;margin:0;color:#f0f0f4}
header .subtitle{margin-top:6px;color:#9b9da7;font-size:11px;letter-spacing:.07em}
main{display:flex;justify-content:center;align-items:center;flex:0 0 auto;min-height:0;width:100%;overflow:visible}
.watch{position:relative;width:min(94vw,47dvh,545px);aspect-ratio:545 / 825;isolation:isolate;user-select:none;-webkit-user-select:none;flex-shrink:0}
.watch img,.watch svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.watch img{object-fit:fill}.watch svg{overflow:visible}
footer{text-align:center;width:100%;padding:5px 12px max(14px,env(safe-area-inset-bottom));flex-shrink:0}
.digital{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';font-size:clamp(18px,4vw,25px);letter-spacing:.09em;font-weight:500}
.date-text{font-size:12px;color:#9c9fa9;margin:4px 0 10px}
.status{display:flex;justify-content:center;align-items:center;gap:6px;color:#b8bbc5;font-size:11px;min-height:18px}
.dot{width:7px;height:7px;border-radius:50%;background:#c28b3f;display:inline-block}.dot.ok{background:#68bd85}
.actions{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
[hidden]{display:none!important}
button,select{background:#1b1d26;border:1px solid #363947;color:#eceef2;border-radius:20px;font:inherit;font-size:12px;padding:8px 13px;cursor:pointer}
button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:wait}
select{max-width:185px}
@media(max-height:680px){header{padding-top:8px}header .subtitle{display:none}.date-text{margin-bottom:3px}.actions{margin-top:5px}footer{padding-bottom:8px}.watch{width:min(89vw,45dvh,545px)}}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}

/* Commutatore JB discreto, ma con area tattile adeguata */
.title-line{display:flex;align-items:center;justify-content:center;gap:12px}
.title-line h1{margin:0}
.jb-toggle{font-size:11px;font-weight:700;letter-spacing:.08em;line-height:1;padding:8px 9px;min-width:34px;min-height:32px;border-radius:8px;border:1px solid #515361;background:#151820;color:#c2c4ca;transition:background .15s,border-color .15s,color .15s}
.jb-toggle[aria-pressed="true"]{background:#624820;border-color:#c4a366;color:#ffe0a0}
.jb-toggle:focus-visible{outline:2px solid #f9d59b;outline-offset:3px}
.watch.jb{aspect-ratio:2 / 3}
.watch.jb img{object-fit:fill}
@media(max-height:680px){.title-line{gap:8px}.jb-toggle{min-height:29px}}
@media (min-height:681px) and (max-height:760px){header{padding-top:8px}.date-text{margin-bottom:5px}.actions{margin-top:6px}footer{padding-bottom:8px}}

/* Corona: il doppio clic/tocco alterna gli scatti; lo sfregamento verticale regola. */
.crown-hit{touch-action:none;cursor:pointer;outline:none}
.crown-hit:active{cursor:ns-resize}
.crown-hit:focus-visible{stroke:#f1cf8e;stroke-width:7;stroke-opacity:.8}
/* Grips HTML invisibili: indipendenti dal viewBox SVG e raggiungibili anche sul telefono.
   Non alterano in alcun modo la dimensione o la posizione dell'orologio. */
.crown-touch{position:absolute;z-index:5;display:block;background:transparent;border:0;outline:none;
  cursor:ns-resize;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent}
.crown-touch:focus-visible{outline:2px solid rgba(241,207,142,.45);outline-offset:-2px}
#crownTouchClassic{left:80%;top:40%;width:20%;height:20%}
#crownTouchJB{left:79%;top:37%;width:21%;height:22%}
/* A corona estratta si può scorrere su una zona comoda verso l'interno, senza rischiare
   il gesto di navigazione Android sul bordo destro. */
#crownTouchClassic.is-adjusting{left:55%;top:33%;width:45%;height:35%}
#crownTouchJB.is-adjusting{left:55%;top:32%;width:45%;height:36%}
/* Nessuno spazio extra fra il quadrante e l’ora digitale. */
/* L'inserto nero ruota mentre il vetro e le lancette rimangono fermi. */
.bezel-grip{touch-action:none;cursor:grab;pointer-events:stroke;outline:none}
.bezel-grip:active{cursor:grabbing}
.bezel-grip:focus-visible{stroke:#e7c67e;stroke-opacity:.35}
</style></head><body>

'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
let baseEpoch = Date.now(), basePerf = performance.now(), synced = false;
const MANUAL_KEY = 'rolex-crown-regolazioni-v1';
let manualOffsetMs=0, manualDayShift=0, manualActive=false, manualRevision=0;
try{
 const saved=JSON.parse(localStorage.getItem(MANUAL_KEY)||'null');
 if(saved?.active && Number.isFinite(saved.epochAtSave) && Number.isFinite(saved.wallAtSave) && Number.isFinite(saved.dayShift)){
  manualActive=true; manualDayShift=saved.dayShift;
  manualOffsetMs=saved.epochAtSave+(Date.now()-saved.wallAtSave)-Date.now();
 }
}catch(err){console.warn('Preferenze manuali non disponibili',err)}

/* Ghiera Submariner: modello Date 120 click antiorari; modello 6538 vintage a frizione bidirezionale. */
const bezelModels = {
 classic:{rot:'bezelRotClassic',grip:'bezelGestureClassic',cx:618,cy:470,step:3,onlyCCW:true,storage:'rolex-bezel-classic-v1',angle:0},
 jb:{rot:'bezelRotJB',grip:'bezelGestureJB',cx:502,cy:703,step:0,onlyCCW:false,storage:'rolex-bezel-jb-v1',angle:0}
};
const mod360=(n)=>((n%360)+360)%360;
function showBezel(b){
 b.angle=mod360(b.angle);
 $(b.rot).setAttribute('transform',`rotate(${b.angle} ${b.cx} ${b.cy})`);
 const minute=mod360(-b.angle)/6;
 $(b.grip).setAttribute('aria-valuenow',String(Math.round(minute*2)/2));
 $(b.grip).setAttribute('aria-valuetext',`${minute.toFixed(1)} minuti`);
}
function saveBezel(b){try{localStorage.setItem(b.storage,String(b.angle));}catch(e){}}
function bezelPointerAngle(ev,b){
 const svg=$(b.grip).ownerSVGElement,rect=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
 /* I due viewBox hanno lo stesso rapporto del contenitore fotografico. */
 const x=vb.x+(ev.clientX-rect.left)*vb.width/rect.width;
 const y=vb.y+(ev.clientY-rect.top)*vb.height/rect.height;
 return Math.atan2(y-b.cy,x-b.cx)*180/Math.PI;
}
const angleDelta=(a)=>((a+540)%360)-180;
for(const b of Object.values(bezelModels)){
 const hit=$(b.grip);
 try{let x=Number(localStorage.getItem(b.storage));if(Number.isFinite(x))b.angle=x;}catch(e){}
 if(b.onlyCCW)b.angle=Math.round(b.angle/b.step)*b.step;
 showBezel(b);
 let drag=null;
 hit.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='mouse'&&ev.button!==0)return;
  ev.preventDefault();
  drag={id:ev.pointerId,last:bezelPointerAngle(ev,b),total:0,start:b.angle};
  hit.setPointerCapture(ev.pointerId);
 });
 hit.addEventListener('pointermove',ev=>{
  if(!drag||ev.pointerId!==drag.id)return;
  ev.preventDefault();
  const theta=bezelPointerAngle(ev,b),delta=angleDelta(theta-drag.last);
  drag.last=theta;
  drag.total+=b.onlyCCW?Math.min(delta,0):delta;
  const d=b.step?(b.onlyCCW?Math.ceil(drag.total/b.step):Math.round(drag.total/b.step))*b.step:drag.total;
  b.angle=drag.start+d;
  showBezel(b);
 });
 const done=ev=>{if(!drag||ev.pointerId!==drag.id)return;drag=null;saveBezel(b);};
 hit.addEventListener('pointerup',done);
 hit.addEventListener('pointercancel',done);
 hit.addEventListener('lostpointercapture',done);
 hit.addEventListener('dblclick',ev=>{ev.preventDefault();b.angle=0;showBezel(b);saveBezel(b);});
 hit.addEventListener('keydown',ev=>{
  const d=ev.key==='ArrowLeft'?-1:(ev.key==='ArrowRight'&&!b.onlyCCW)?1:0;
  if(ev.key==='Home'){b.angle=0;showBezel(b);saveBezel(b);ev.preventDefault();return;}
  if(!d)return;
  b.angle+=d*(b.step||6);showBezel(b);saveBezel(b);ev.preventDefault();
 });
}

/* Corona fisica: primo scatto = data (moderno) / ora (JB); secondo scatto = ora (moderno).
   Un altro doppio clic riporta in posizione di riposo. Doppio tocco funziona su touch. */
const crownModels={
 classic:{name:'Rolex classico',hit:'crownHitClassic',touch:'crownTouchClassic',cover:'crownClassicCover',shift:'crownClassicShift',stem:'crownClassicStem',steps:['riposo','data','ora'],offsets:[0,10,20],position:0},
 jb:{name:'James Bond',hit:'crownHitJB',touch:'crownTouchJB',cover:'crownJBCover',shift:'crownJBShift',stem:'crownJBStem',steps:['riposo','ora'],offsets:[0,19],position:0}
};
function activeCrown(){return $('watchJB').hidden?crownModels.classic:crownModels.jb}
function updateCrownGuide(){
  // Nessun testo visibile: le indicazioni restano soltanto negli attributi accessibili.
  const c=activeCrown();
 $(c.touch).setAttribute('aria-label',`${c.name}, posizione ${c.steps[c.position]}. Doppio tocco per cambiare posizione; scorrimento verticale per regolare.`);
 }
function showCrown(c){
 const dx=c.offsets[c.position];
 $(c.cover).style.display=dx?'':'none';
 $(c.shift).setAttribute('transform',`translate(${dx} 0)`);
 const stem=$(c.stem),x=c.name==='James Bond'?882:842;
 stem.setAttribute('width',String(dx+5));
  $(c.hit).setAttribute('transform',`translate(${dx} 0)`);
 $(c.touch).classList.toggle('is-adjusting',c.position!==0);
 $(c.touch).setAttribute('aria-label',`${c.name}: ${c.steps[c.position]}. Doppio clic o doppio tocco per cambiare posizione, trascina per regolare`);
 updateCrownGuide();
}
// Nella posizione di regolazione dell’ora il movimento si ferma (hacking seconds).
// Al rientro recuperiamo il tempo di arresto, così riparte dal secondo esatto in cui si è fermato.
function advanceCrown(c){
 const wasTimeSetting=c.steps[c.position]==='ora';
 if(wasTimeSetting && Number.isFinite(c.hackStartPerf)){
  manualOffsetMs-=performance.now()-c.hackStartPerf;
  c.hackStartPerf=null;c.hackAnchorEpoch=null;c.hackOffsetStart=null;
  persistManual(); // memorizza anche il tempo trascorso con la corona estratta
 }
 c.position=(c.position+1)%c.steps.length;
 if(c.steps[c.position]==='ora'){
  c.hackStartPerf=performance.now();
  c.hackAnchorEpoch=currentEpoch()+manualOffsetMs;
  c.hackOffsetStart=manualOffsetMs;
  manualRevision++; // impedisce a una sincronizzazione automatica già avviata di intervenire
 }
 showCrown(c);
 frame();
}
function displayEpochFor(c){
 return c.steps[c.position]==='ora' && Number.isFinite(c.hackAnchorEpoch)
  ?c.hackAnchorEpoch+(manualOffsetMs-c.hackOffsetStart)
  :currentEpoch()+manualOffsetMs;
}
function persistManual(){
 manualActive=true; manualRevision+=1;
 try{localStorage.setItem(MANUAL_KEY,JSON.stringify({active:true,epochAtSave:currentEpoch()+manualOffsetMs,wallAtSave:Date.now(),dayShift:manualDayShift}));}catch(e){}
}
function adjustCrown(c,delta){
 if(!delta || c.position===0)return;
 if(c.steps[c.position]==='data')manualDayShift+=delta;
 else manualOffsetMs+=delta*60*1000;
 persistManual();
 window.lastDayText='';
 status('Regolazione manuale · mantenuta fino a Sincronizza ora',false);
 frame();
}
for(const c of Object.values(crownModels)){
  const hit=$(c.touch); // Una zona HTML e non un rettangolo SVG fuori dal bordo dell'immagine.
  let drag=null,lastTap=0,lastTapX=0,lastTapY=0,lastInputType='mouse';
  const toggle=()=>{lastTap=0;advanceCrown(c);};
  hit.addEventListener('pointerdown',e=>{
   if(e.pointerType==='mouse' && e.button!==0)return;
   e.preventDefault();
   lastInputType=e.pointerType;
   drag={id:e.pointerId,lastY:e.clientY,startX:e.clientX,startY:e.clientY,remainder:0,moved:false};
   try{hit.setPointerCapture(e.pointerId);}catch(err){}
  });
  hit.addEventListener('pointermove',e=>{
   if(!drag || e.pointerId!==drag.id)return;
   e.preventDefault();
   const dy=drag.lastY-e.clientY;drag.lastY=e.clientY;
   if(Math.abs(drag.startY-e.clientY)>5 || Math.abs(drag.startX-e.clientX)>5)drag.moved=true;
   if(c.position===0 || !drag.moved)return;
   drag.remainder+=dy;
   // Soglia più piccola per lo schermo del telefono: un movimento normale è percepito.
   const stepSize=e.pointerType==='mouse'?14:10;
   const steps=Math.trunc(drag.remainder/stepSize);
   if(steps){adjustCrown(c,steps);drag.remainder-=steps*stepSize;}
  });
  hit.addEventListener('pointerup',e=>{
   if(!drag || e.pointerId!==drag.id)return;
   const moved=drag.moved;
   drag=null;
   if(e.pointerType!=='mouse' && !moved){
    const now=performance.now();
    if(now-lastTap<500 && Math.hypot(e.clientX-lastTapX,e.clientY-lastTapY)<44){toggle();}
    else{lastTap=now;lastTapX=e.clientX;lastTapY=e.clientY;}
   }
  });
  hit.addEventListener('pointercancel',()=>{drag=null});
  hit.addEventListener('lostpointercapture',()=>{drag=null});
  // Il doppio tocco è gestito esclusivamente dai PointerEvent; dblclick solo per mouse.
  hit.addEventListener('dblclick',e=>{e.preventDefault();if(lastInputType==='mouse')toggle();});
  hit.addEventListener('wheel',e=>{
   if(c.position===0)return;
   e.preventDefault();
   const steps=Math.max(-10,Math.min(10,Math.sign(-e.deltaY)*Math.max(1,Math.trunc(Math.abs(e.deltaY)/100))));
   adjustCrown(c,steps);
  },{passive:false});
  hit.addEventListener('keydown',e=>{
   if(e.key==='Enter' || e.key===' '){e.preventDefault();advanceCrown(c);}
   if(e.key==='ArrowUp' || e.key==='ArrowRight'){e.preventDefault();adjustCrown(c,1);}
   if(e.key==='ArrowDown' || e.key==='ArrowLeft'){e.preventDefault();adjustCrown(c,-1);}
  });
  showCrown(c);
 }
window.__crownInitialized=true;updateCrownGuide();
function clearManualAfterSuccessfulSync(){
 manualOffsetMs=0;manualDayShift=0;manualActive=false;manualRevision++;
 try{localStorage.removeItem(MANUAL_KEY);}catch(e){}
 for(const c of Object.values(crownModels)){
  c.position=0;
  c.hackStartPerf=null;c.hackAnchorEpoch=null;c.hackOffsetStart=null;
  showCrown(c);
 }
 window.lastDayText='';
}

function frame(){
 // Durante la regolazione dell’ora si arresta l’avanzamento del movimento;
 // la data (primo scatto del moderno) non arresta i secondi.
 const epoch=displayEpochFor(activeCrown()), date=new Date(epoch), tz=zone();
 const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',year:'numeric',month:'2-digit',day:'2-digit',hourCycle:'h23'}).formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
 const ms=((epoch%1000)+1000)%1000;
 const hours=(parts.hour%12)+parts.minute/60+(parts.second+ms/1000)/3600;
 const mins=parts.minute+(parts.second+ms/1000)/60;
 const secs=parts.second+ms/1000;
 $('hourHand').setAttribute('transform',`rotate(${hours*30} 618 470)`);
 $('minuteHand').setAttribute('transform',`rotate(${mins*6} 618 470)`);
 $('secondHand').setAttribute('transform',`rotate(${secs*6} 618 470)`);
 $('jbHourHand').setAttribute('transform',`rotate(${hours*30} 502 703)`);
 $('jbMinuteHand').setAttribute('transform',`rotate(${mins*6} 502 703)`);
 $('jbSecondHand').setAttribute('transform',`rotate(${secs*6} 502 703)`);
 // Date adjustment is calendar-day based: never change the hands when advancing the date.
 const displayDate=new Date(Date.UTC(parts.year,parts.month-1,parts.day+manualDayShift,12));
 $('dayNumber').textContent=String(displayDate.getUTCDate()).padStart(2,'0');
 $('digital').textContent=`${String(parts.hour).padStart(2,'0')}:${String(parts.minute).padStart(2,'0')}:${String(parts.second).padStart(2,'0')}`;
 const dateKey=`${displayDate.toISOString().slice(0,10)}-${tz}`;
 if(window.lastDayText!==dateKey){
  $('fullDate').textContent=new Intl.DateTimeFormat('it-IT',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(displayDate);
  window.lastDayText=dateKey;
 }
}
function status(message,ok){$('status').textContent=message;$('dot').classList.toggle('ok',ok);}
async function fetchWithTimeout(url){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),6500);try{
 const start=performance.now();const res=await fetch(url,{signal:controller.signal,cache:'no-store'});const end=performance.now();
 if(!res.ok)throw Error(`HTTP ${res.status}`);
 return {data:await res.json(), midpoint:(start+end)/2};
}finally{clearTimeout(timeout);}}
async function synchronize({automatic=false}={}){
 if(automatic && (manualActive || Object.values(crownModels).some(c=>c.steps[c.position]==='ora')))return;
 const revisionAtStart=manualRevision;
 const btn=$('syncBtn');btn.disabled=true;
 status('Sincronizzazione con Internet…',false);
 const providers=[
  {url:'https://timeapi.io/api/Time/current/zone?timeZone=UTC',parse:d=>Date.UTC(d.year,d.month-1,d.day,d.hour,d.minute,d.seconds||0,d.milliSeconds||0)},
  {url:'https://worldtime.timezone.io/api/timezone/Etc/UTC',parse:d=>Date.parse(d.utc_datetime||d.datetime)}
 ];
 for(const p of providers){try{
  const {data,midpoint}=await fetchWithTimeout(p.url);
  const epoch=p.parse(data);if(!Number.isFinite(epoch))throw Error('Data non valida');
  // Never discard a manual adjustment if it was made while the request was in flight.
  if(automatic && (manualActive || revisionAtStart!==manualRevision || Object.values(crownModels).some(c=>c.steps[c.position]==='ora'))){
   status('Regolazione manuale conservata',false);btn.disabled=false;return;
  }
  baseEpoch=epoch;basePerf=midpoint;synced=true;
  if(!automatic)clearManualAfterSuccessfulSync();
  status('Sincronizzato con ora Internet',true);btn.disabled=false;return;
 }catch(e){console.warn('Servizio ora non disponibile:',p.url,e)}}
 if(!synced && !manualActive){baseEpoch=Date.now();basePerf=performance.now();}
 status(manualActive?'Rete non disponibile · regolazioni manuali conservate':
        synced?'Rete assente · mantiene ultima sincronizzazione':'Rete non disponibile · ora del dispositivo',false);
 btn.disabled=false;
}
$('syncBtn').addEventListener('click',()=>synchronize({automatic:false}));
$('zone').addEventListener('change',()=>{window.lastDayText='';status(manualActive?'Regolazione manuale conservata':synced?'Sincronizzato con ora Internet':'Ora del dispositivo',synced&&!manualActive);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden && navigator.onLine && !manualActive)synchronize({automatic:true});});
window.addEventListener('online',()=>{if(!manualActive)synchronize({automatic:true});});
frame();setInterval(frame,50);
if(manualActive)status('Regolazione manuale ripristinata · premi Sincronizza ora per azzerarla',false);
else synchronize({automatic:true});
setInterval(()=>{if(navigator.onLine&&!manualActive)synchronize({automatic:true});},30*60*1000);
